<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matthew's Birthday</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: two full-screen pages stacked; page 1 is a cake scene under floating balloons, page 2 is one big heart. */
:root {
  --bg: #2a1745;
  --bg-glow: #5b2a86;
  --ink: #fff4e6;
  --frosting: #ffd6e7;
  --cake: #f4a261;
  --candle: #5ec8f2;
  --flame: #ffc93c;
  --heart: #ff3d6e;
  --display: "Caprasimo", "Georgia", serif;
  --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page {
  position: absolute; inset: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
  background: radial-gradient(ellipse at 50% 30%, var(--bg-glow), var(--bg) 70%);
  overflow: hidden;
  transition: opacity .9s ease, transform .9s ease;
}
#p2 { opacity: 0; visibility: hidden; transform: scale(1.06); }
body.next #p1 { opacity: 0; visibility: hidden; transform: scale(.94); transition: opacity .9s ease, transform .9s ease, visibility 0s .9s; }
body.next #p2 { opacity: 1; visibility: visible; transform: none; }

h1 {
  font-family: var(--display); font-weight: 400; margin: 0;
  font-size: clamp(2rem, 8vw, 4.2rem); line-height: 1.05; text-align: center;
  text-wrap: balance; z-index: 2; text-shadow: 0 3px 0 rgba(0,0,0,.25);
}
h1 span { color: var(--flame); }
.hint { margin: 0; opacity: .8; font-weight: 600; z-index: 2; text-align: center; }

/* balloons */
.balloons { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.balloon {
  position: absolute; bottom: -140px; width: var(--w); height: calc(var(--w) * 1.2);
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.65), transparent 22%), var(--c);
  border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
  animation: rise var(--t) linear var(--d) infinite;
  opacity: .95;
}
.balloon::before {
  content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px;
  background: var(--c); transform: translateX(-50%) rotate(45deg); border-radius: 2px;
}
.balloon::after {
  content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 70px;
  background: rgba(255,244,230,.55); transform-origin: top; animation: sway 3s ease-in-out infinite alternate;
}
@keyframes rise {
  0% { transform: translateY(0) translateX(0) rotate(-4deg); }
  50% { transform: translateY(-60vh) translateX(18px) rotate(4deg); }
  100% { transform: translateY(-125vh) translateX(-12px) rotate(-4deg); }
}
@keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }

/* cake */
.cake { width: min(78vw, 360px); height: auto; z-index: 1; overflow: visible; cursor: pointer; }
.cake:focus-visible { outline: 3px solid var(--flame); outline-offset: 6px; border-radius: 12px; }
.flame { transform-origin: 150px 62px; animation: flicker .45s ease-in-out infinite alternate; transition: opacity .4s; }
.glow { animation: glow 1.2s ease-in-out infinite alternate; transition: opacity .4s; }
@keyframes flicker { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.88, 1.12) rotate(3deg); } }
@keyframes glow { from { opacity: .35; } to { opacity: .6; } }
.smoke { opacity: 0; }
.out .flame, .out .glow { opacity: 0; animation: none; }
.out .smoke { animation: smoke 2s ease-out forwards; }
@keyframes smoke { 0% { opacity: .7; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

.btn {
  font: 800 1.1rem var(--body); color: #3a1450; background: var(--flame);
  border: 0; border-radius: 999px; padding: .85rem 1.8rem; cursor: pointer; z-index: 2;
  box-shadow: 0 5px 0 #c58f00; transition: transform .1s, box-shadow .1s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c58f00; }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* page 2 */
.heart-wrap { width: min(80vw, 62vh, 520px); aspect-ratio: 1; z-index: 1; display: grid; place-items: center; }
.heart { width: 100%; height: 100%; transform: scale(.08); filter: drop-shadow(0 10px 30px rgba(255,61,110,.55)); }
body.next .heart { animation: grow 3.6s cubic-bezier(.2,.8,.2,1) .5s forwards, beat 1.3s ease-in-out 4.1s infinite; }
@keyframes grow { 0% { transform: scale(.08); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.07); } 30% { transform: scale(1); } 45% { transform: scale(1.05); } }
.love {
  font-family: var(--display); font-size: clamp(1.8rem, 7vw, 3.4rem); margin: 0; text-align: center;
  text-wrap: balance; z-index: 2; opacity: 0; transform: translateY(14px);
}
body.next .love { animation: fadeup 1.4s ease 1.6s forwards; }
@keyframes fadeup { to { opacity: 1; transform: none; } }
.mini { position: absolute; bottom: -40px; color: var(--heart); font-size: var(--s); animation: floatup var(--t) ease-in var(--d) infinite; opacity: 0; }
body.next .mini { opacity: 1; }
@keyframes floatup { to { transform: translateY(-110vh); } }

@media (prefers-reduced-motion: reduce) {
  .balloon, .balloon::after, .flame, .glow, .mini { animation: none; }
  .balloon { bottom: auto; top: var(--top, 10%); }
  body.next .heart { animation: none; transform: none; }
  body.next .love { animation: none; opacity: 1; transform: none; }
}
</style>
</head>
<body>


<main>
  <section class="page" id="p1" aria-label="Birthday">
    <div class="balloons" id="balloons" aria-hidden="true"></div>
    <h1>Happy Birthday, <span>Matthew!</span></h1>

    <svg class="cake" id="cake" viewBox="0 0 300 250" role="button" tabindex="0" aria-label="Birthday cake with one candle. Activate to blow it out.">
      <ellipse cx="150" cy="232" rx="140" ry="14" fill="#000" opacity=".25"/>
      <ellipse cx="150" cy="224" rx="135" ry="14" fill="#f3e9f7"/>
      <!-- bottom tier -->
      <rect x="40" y="150" width="220" height="74" rx="10" fill="var(--cake)"/>
      <rect x="40" y="188" width="220" height="10" fill="#e08a40" opacity=".6"/>
      <path d="M40 160 q0-20 20-20 h180 q20 0 20 20 v6 q-12 14-24 0 q-12 18-26 0 q-12 14-24 0 q-12 18-26 0 q-12 14-24 0 q-12 18-26 0 q-12 14-24 0 q-12 14-26 0z" fill="var(--frosting)"/>
      <!-- top tier -->
      <rect x="85" y="100" width="130" height="54" rx="9" fill="#ff8fb8"/>
      <path d="M85 108 q0-14 14-14 h102 q14 0 14 14 v4 q-10 12-20 0 q-10 14-20 0 q-10 12-20 0 q-10 14-20 0 q-10 12-20 0 q-8 10-10 0z" fill="#fff0f6"/>
      <circle cx="115" cy="134" r="5" fill="#fff0f6"/><circle cx="150" cy="140" r="5" fill="#ffd36b"/><circle cx="185" cy="134" r="5" fill="#fff0f6"/>
      <circle cx="75" cy="178" r="5" fill="#ff8fb8"/><circle cx="150" cy="184" r="5" fill="#ff8fb8"/><circle cx="225" cy="178" r="5" fill="#ff8fb8"/>
      <!-- candle -->
      <rect x="141" y="66" width="18" height="36" rx="3" fill="var(--candle)"/>
      <path d="M141 76 l18 -6 M141 86 l18 -6 M141 96 l18 -6" stroke="#fff" stroke-width="3" opacity=".7"/>
      <rect x="148.5" y="60" width="3" height="8" fill="#3a2a2a"/>
      <circle class="glow" cx="150" cy="48" r="34" fill="var(--flame)" opacity=".4"/>
      <g class="flame">
        <path d="M150 24 C140 40 138 52 150 62 C162 52 160 40 150 24Z" fill="#ff8a1f"/>
        <path d="M150 38 C145 47 145 54 150 60 C155 54 155 47 150 38Z" fill="#fff2a8"/>
      </g>
      <g class="smoke" stroke="#fff4e6" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M150 58 q-8-10 0-20 q8-10 0-20"/>
      </g>
    </svg>

    <p class="hint" id="hint">Tap the cake to blow out the candle</p>
    <button class="btn" id="next" type="button">Next &rarr;</button>
  </section>

  <section class="page" id="p2" aria-label="Love note">
    <div class="balloons" id="minis" aria-hidden="true"></div>
    <div class="heart-wrap">
      <svg class="heart" viewBox="0 0 100 92" aria-hidden="true">
        <defs>
          <radialGradient id="hg" cx="35%" cy="30%" r="80%">
            <stop offset="0" stop-color="#ff8fa8"/><stop offset=".55" stop-color="#ff3d6e"/><stop offset="1" stop-color="#c2154a"/>
          </radialGradient>
        </defs>
        <path d="M50 88 C20 66 3 48 3 28 C3 14 14 4 27 4 C37 4 45 9 50 18 C55 9 63 4 73 4 C86 4 97 14 97 28 C97 48 80 66 50 88Z" fill="url(#hg)"/>
        <ellipse cx="28" cy="22" rx="9" ry="5" transform="rotate(-35 28 22)" fill="#fff" opacity=".4"/>
      </svg>
    </div>
    <p class="love">I love you so much</p>
  </section>
</main>

<script>
(function () {
  var colors = ["#ff4d6d", "#ffc93c", "#4cc9f0", "#7bd88f", "#b388ff", "#ff8a3d"];
  var box = document.getElementById("balloons");
  for (var i = 0; i < 12; i++) {
    var b = document.createElement("div");
    b.className = "balloon";
    b.style.setProperty("--c", colors[i % colors.length]);
    b.style.setProperty("--w", (46 + (i * 7) % 26) + "px");
    b.style.setProperty("--t", (11 + (i * 3) % 7) + "s");
    b.style.setProperty("--d", (-i * 1.3) + "s");
    b.style.setProperty("--top", (8 + (i * 17) % 70) + "%");
    b.style.left = (3 + i * 8.2) + "%";
    box.appendChild(b);
  }
  var minis = document.getElementById("minis");
  for (var j = 0; j < 14; j++) {
    var m = document.createElement("span");
    m.className = "mini";
    m.textContent = "♥";
    m.style.left = (4 + j * 7) + "%";
    m.style.setProperty("--s", (14 + (j * 5) % 22) + "px");
    m.style.setProperty("--t", (7 + (j * 2) % 6) + "s");
    m.style.setProperty("--d", (-j * 0.9) + "s");
    minis.appendChild(m);
  }

  var cake = document.getElementById("cake");
  var hint = document.getElementById("hint");
  function blow() {
    if (cake.classList.contains("out")) return;
    cake.classList.add("out");
    hint.textContent = "Make a wish! ✨";
  }
  cake.addEventListener("click", blow);
  cake.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); blow(); }
  });
  document.getElementById("next").addEventListener("click", function () {
    document.body.classList.add("next");
  });
})();
</script>

</body>
</html>
